# Values for the community cilium chart (https://helm.cilium.io/), overrides only.
#
# This replaced the Isovalent cilium-enterprise chart, which was only in use for
# Hubble Timescape (and its cilium-vector shipper, which wrote ~3 GB/day of flow
# logs to each node's disk). Everything below mirrors the settings the enterprise
# release was running with (kube-system/cilium-config at the time of the switch), so
# the datapath does not change - in particular IPAM must stay cluster-pool: changing
# IPAM mode under running pods breaks pod networking.
#
# Kept as overrides rather than a full `helm show values` dump so the same file
# works across chart minors (1.17 -> 1.18 -> 1.19 are separate upgrades).

# Talos: no kube-proxy replacement, API server reached directly.
kubeProxyReplacement: false
k8sServiceHost: "192.168.5.122"
k8sServicePort: "6443"

socketLB:
  enabled: true

ipam:
  mode: cluster-pool
  operator:
    clusterPoolIPv4PodCIDRList: ["10.0.0.0/8"]
    clusterPoolIPv4MaskSize: 24

enableIPv4Masquerade: true

# The community chart defaults this to true; the enterprise release ran with false.
enableNonDefaultDenyPolicies: false

# Mutual-auth processing (mesh-auth-enabled); on in the enterprise release.
authentication:
  enabled: true

# Talos mounts cgroupv2 itself and does not allow SYS_MODULE.
cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup
securityContext:
  capabilities:
    ciliumAgent: [CHOWN, KILL, NET_ADMIN, NET_RAW, IPC_LOCK, SYS_ADMIN, SYS_RESOURCE, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    cleanCiliumState: [NET_ADMIN, SYS_ADMIN, SYS_RESOURCE]

hubble:
  enabled: true
  metrics:
    enabled:
      - dns:query;ignoreAAAA
      - drop
      - tcp
      - flow
      - icmp
      - http
  relay:
    enabled: true
  # Regular Hubble UI, exposed by the hubble_ui VirtualServer in cilium.tf.
  ui:
    enabled: true
  # No flow export: that only existed to feed Timescape.
  export:
    dynamic:
      enabled: false
