# Turn SELinux off. Talos runs it in permissive mode, where it blocks nothing but
# logs an AVC denial for every write to NFS (network_fs_t) and unlabeled host
# volumes - thousands an hour on talos-iso-cgi. Enforcing would break those
# workloads, so permissive only ever produced noise.
#
# This is an Image Factory schematic fragment, not a machine config patch.
# Talos 1.14 deprecates .machine.install.extraKernelArgs. With the
# UnattendedInstallConfig document, GRUB boots with the kernel command line baked
# into the image (grubUseUKICmdline), which rejects extraKernelArgs. talos.tf
# merges this into every node's schematic, so the arg ships with the installer
# image and takes effect on the next `talosctl upgrade`.
customization:
  extraKernelArgs:
    - selinux=0
