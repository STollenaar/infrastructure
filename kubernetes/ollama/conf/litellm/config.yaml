# Backed by llama-swap -> llama.cpp (see ../../llama-swap.tf), previously ollama.
#
# The model_name values are the public contract: callers reach this proxy through
# its VirtualServer host (litellm.tf) and ask for these strings.
#
# Provider is `openai/` because llama-server exposes an OpenAI-compatible API.
# The model id after the slash must match a key in llama-swap's models map - that is
# what llama-swap uses to decide which llama-server to spin up. api_key is required
# by the OpenAI client but unused by llama-server.
model_list:
  # General chat / instructions.
  - model_name: qwen3.8-27b
    litellm_params:
      model: openai/qwen3.8-27b
      api_base: os.environ/LLAMA_SWAP_BASE_URL
      api_key: "none"

  # Summarisation (thinking disabled on the backend).
  #
  # NOTE: the old mistral-summary model was an ollama Modelfile
  # (conf/ollama/mistral-summary.modelfile) that baked a summarisation SYSTEM prompt
  # in. llama-server has no equivalent - its only prompt knobs are --chat-template/
  # --chat-template-file/--chat-template-kwargs, none of which inject a system
  # message - so callers have to send that prompt themselves. The text is still in
  # the modelfile.
  - model_name: qwen3.5-9b
    litellm_params:
      model: openai/qwen3.5-9b
      api_base: os.environ/LLAMA_SWAP_BASE_URL
      api_key: "none"
