# Backed by llama-swap -> llama.cpp (see ../../llama-swap.tf), previously ollama.
#
# The model_name values are the public contract: callers reach this proxy through
# ollama.home.spicedelver.me and ask for these strings, so they are kept exactly as
# they were even though the provider underneath changed.
#
# Provider is now `openai/` because llama-server exposes an OpenAI-compatible API.
# The model id after the slash must match a key in llama-swap's models map - that is
# what llama-swap uses to decide which llama-server to spin up. api_key is required
# by the OpenAI client but unused by llama-server.
model_list:
  - model_name: mistral
    litellm_params:
      model: openai/mistral
      api_base: os.environ/LLAMA_SWAP_BASE_URL
      api_key: "none"

  # NOTE: behaviour change. Under ollama this was a Modelfile (conf/ollama/
  # mistral-summary.modelfile) that baked a summarisation SYSTEM prompt into the
  # model, so callers got it for free. llama-server has no equivalent: its only
  # prompt knobs are --chat-template/--chat-template-file/--chat-template-kwargs,
  # verified against `llama-server --help` in the image, and none of them inject a
  # system message.
  #
  # So this entry now serves plain mistral, and the summarisation prompt has to be
  # re-homed - either sent by the caller as a system message, or baked into a custom
  # Jinja chat template passed to this model's llama-swap entry. The prompt text is
  # still in conf/ollama/mistral-summary.modelfile, kept for that purpose.
  - model_name: mistral-summary
    litellm_params:
      model: openai/mistral
      api_base: os.environ/LLAMA_SWAP_BASE_URL
      api_key: "none"

  # Public name keeps the ollama-style tag; the llama-swap key cannot contain a colon
  # cleanly, so it is llama3.2-3b on the backend.
  - model_name: llama3.2:3b
    litellm_params:
      model: openai/llama3.2-3b
      api_base: os.environ/LLAMA_SWAP_BASE_URL
      api_key: "none"
