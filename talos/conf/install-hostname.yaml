# Static network setup for a node (Talos 1.12+ multi-doc network config).
# Replaces the deprecated .machine.network.{hostname,nameservers,interfaces}.

# The generated config ships a HostnameConfig with `auto: stable`; a static
# hostname is only valid alongside `auto: off`, so both are set here.
apiVersion: v1alpha1
kind: HostnameConfig
auto: "off"
hostname: ${hostname}
---
# Merges into the generated ResolverConfig, which carries the hostDNS settings.
apiVersion: v1alpha1
kind: ResolverConfig
nameservers:
  - address: 192.168.5.1
  - address: 142.166.166.166
  - address: 1.1.1.1
  - address: 8.8.8.8
---
# A link configured here is skipped by the default DHCP operator, which is what
# the old `dhcp: false` did.
apiVersion: v1alpha1
kind: LinkConfig
name: ens18
mtu: 1500
addresses:
  - address: ${endpoint}/24
routes:
  # No destination means a default route; 0.0.0.0/0 is rejected by validation.
  - gateway: 192.168.5.1
